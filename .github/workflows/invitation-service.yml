name: Invitation service

# Tests the Cloudflare Worker on every change; deploys it from main.
#
# Deploy needs these repository secrets (docs/09-invitation-service.md):
#   CLOUDFLARE_API_TOKEN    token with Workers Scripts:Edit, D1:Edit (+ Workers Routes/DNS for a custom domain)
#   CLOUDFLARE_ACCOUNT_ID   your Cloudflare account ID
#   FAMILOQ_ADMIN_TOKEN     long random string - your password for /admin
#   FAMILOQ_TOKEN_SECRET    long random string - signs session tokens (never change it)
# Optional repository variable:
#   FAMILOQ_API_DOMAIN      e.g. familoq-api.carolandmartin.com (zone must be in the same Cloudflare account)

on:
  push:
    paths:
      - "server/invitation-service/**"
      - ".github/workflows/invitation-service.yml"
  workflow_dispatch:

concurrency:
  group: invitation-service-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: server/invitation-service

jobs:
  test:
    name: Test worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FAMILOQ_ADMIN_TOKEN: ${{ secrets.FAMILOQ_ADMIN_TOKEN }}
      FAMILOQ_TOKEN_SECRET: ${{ secrets.FAMILOQ_TOKEN_SECRET }}
      API_DOMAIN: ${{ vars.FAMILOQ_API_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        id: check
        run: |
          missing=""
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FAMILOQ_ADMIN_TOKEN FAMILOQ_TOKEN_SECRET; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Invitation service not deployed - missing secrets:$missing (see docs/09-invitation-service.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            [ ${#FAMILOQ_ADMIN_TOKEN} -ge 16 ] || { echo "::error::FAMILOQ_ADMIN_TOKEN must be at least 16 characters"; exit 1; }
            [ ${#FAMILOQ_TOKEN_SECRET} -ge 16 ] || { echo "::error::FAMILOQ_TOKEN_SECRET must be at least 16 characters"; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Ensure D1 database exists
        if: steps.check.outputs.ready == 'true'
        run: |
          find_id() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);const d=l.find(x=>x.name==="familoq-invitations");process.stdout.write(d?(d.uuid||d.id||""):"")}catch{}})'; }
          DB_ID=$(find_id)
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database familoq-invitations"
            npx wrangler d1 create familoq-invitations
            DB_ID=$(find_id)
          fi
          [ -n "$DB_ID" ] || { echo "::error::Could not find or create the D1 database (check token permission D1:Edit)"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.toml
          echo "D1 database: $DB_ID"

      - name: Custom domain
        if: steps.check.outputs.ready == 'true' && env.API_DOMAIN != ''
        run: |
          sed -i "s|# ROUTES_PLACEHOLDER.*|routes = [{ pattern = \"$API_DOMAIN\", custom_domain = true }]|" wrangler.toml
          grep routes wrangler.toml

      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply familoq-invitations --remote

      - name: Deploy worker
        if: steps.check.outputs.ready == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          [ -n "$API_DOMAIN" ] && URL="https://$API_DOMAIN"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Set worker secrets
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$FAMILOQ_TOKEN_SECRET" | npx wrangler secret put TOKEN_SECRET
          printf '%s' "$FAMILOQ_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SERVICE_URL/health"; then echo; break; fi
            echo "waiting for $SERVICE_URL ..."; sleep 10
          done
          curl -fsS "$SERVICE_URL/health" > /dev/null || { echo "::error::$SERVICE_URL/health is not reachable"; exit 1; }
          {
            echo "## Invitation service deployed"
            echo "- API: $SERVICE_URL"
            echo "- Admin page: $SERVICE_URL/admin"
            echo "- The app uses FQ_INVITE_SERVICE_URL in Config/App.xcconfig - it must match the API URL."
          } >> "$GITHUB_STEP_SUMMARY"
