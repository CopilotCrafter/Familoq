name: Newest iOS probe

# Diagnostic: runs the scan pipeline tests with the NEWEST Xcode and iOS
# simulator on the runner (testers may run a newer iOS than CI's default).
on:
  push:
    branches: [ios27-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Available Xcode versions and simulators
        run: |
          echo "::notice title=Xcodes::$(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          echo "::notice title=Runtimes::$(xcrun simctl list runtimes | grep -i ios | tr '\n' ' ')"
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          echo "::notice title=Using::$NEWEST $(xcodebuild -version | tr '\n' ' ')"
          echo "::notice title=Runtimes for it::$(xcrun simctl list runtimes | grep -i ios | tr '\n' ' ')"
      - name: Generate project
        run: bash scripts/ci/generate-project.sh
      - name: Scan pipeline tests on newest iOS
        run: |
          UDID=$(bash scripts/ci/pick-simulator.sh 2> pick.txt)
          echo "::notice title=Simulator::$(cat pick.txt)"
          set +e
          xcodebuild test -project Familoq.xcodeproj -scheme Familoq -destination "id=$UDID" \
            -only-testing:FamiloqTests/ReceiptPipelineTests \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          RC=$?
          grep -E "Test Case .*(passed|failed)|Fatal error|Terminating|crash|error:|\*\* TEST" test.log | grep -v CoreData | head -15 | while IFS= read -r line; do
            echo "::warning title=Test::$line"
          done
          grep -E "^OCR lines|^Currency:" test.log | head -5 | while IFS= read -r line; do echo "::notice title=Output::${line:0:900}"; done
          exit $RC
