name: Release (TestFlight / App Store)

# Fully automatic delivery - entirely on GitHub macOS runners, no local Mac.
#
#   push to main  -> Build workflow green -> THIS workflow -> TestFlight
#                    (turn off with repository variable AUTO_TESTFLIGHT = false)
#   push tag v1.2.3 -> build + TestFlight + wait for Apple processing
#                    -> submit version 1.2.3 for App Store review
#                    (only when repository variable APP_STORE_SUBMISSIONS = true)
#   manual        -> Actions -> "Release (TestFlight / App Store)" -> Run workflow
#
# Apple reviews every App Store version (usually ~24 h). After approval the
# version goes live automatically if variable APP_STORE_AUTO_RELEASE = true,
# otherwise you press "Release" in App Store Connect.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions),
# created from Windows as described in docs/02-apple-account-and-signing.md:
#   APPLE_TEAM_ID                   10-character Team ID
#   IOS_DIST_CERT_P12_BASE64        Apple Distribution certificate (.p12), base64
#   IOS_DIST_CERT_PASSWORD          password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64 App Store provisioning profile, base64
#   ASC_KEY_ID                      App Store Connect API key ID
#   ASC_ISSUER_ID                   App Store Connect API issuer ID
#   ASC_PRIVATE_KEY                 contents of AuthKey_XXXX.p8
#   KEYCHAIN_PASSWORD               any random string (temporary keychain)
#
# Until the secrets exist, automatic runs are skipped with a notice (not red).
# NOTHING secret is ever committed. Files are decoded into $RUNNER_TEMP and
# deleted at the end of the job.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown to users (e.g. 0.2.0). Empty = value in Config/App.xcconfig"
        required: false
        default: ""
      submit_for_review:
        description: "Also submit this version for App Store review"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Decide what to release
    runs-on: ubuntu-latest
    # Automatic runs only after a GREEN Build on main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.AUTO_TESTFLIGHT != 'false')
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      submit: ${{ steps.mode.outputs.submit }}
      version: ${{ steps.mode.outputs.version }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Check that all signing secrets exist
        id: check
        run: |
          missing=""
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "::notice::Automatic TestFlight skipped - Apple signing secrets not set yet:$missing (see docs/00-START-HERE.md, section D)"
            exit 0
          fi
          echo "::error::Missing secrets:$missing - see docs/02-apple-account-and-signing.md"
          exit 1

      - name: Decide mode
        id: mode
        run: |
          SUBMIT=false
          VERSION="${{ github.event.inputs.marketing_version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            SUBMIT=true
          fi
          if [ "${{ github.event.inputs.submit_for_review }}" = "true" ]; then SUBMIT=true; fi
          if [ "$SUBMIT" = "true" ] && [ "${{ vars.APP_STORE_SUBMISSIONS }}" != "true" ]; then
            echo "::warning::App Store submission requested but repository variable APP_STORE_SUBMISSIONS is not 'true' - uploading to TestFlight only."
            SUBMIT=false
          fi
          echo "submit=$SUBMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Mode: submit_for_review=$SUBMIT version='${VERSION:-from xcconfig}'"

  testflight:
    name: Archive, sign & upload
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      SUBMIT_FOR_REVIEW: ${{ needs.preflight.outputs.submit }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # For automatic runs, release exactly the commit that the Build workflow tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select Xcode
        run: |
          if [ -n "${{ vars.XCODE_VERSION }}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${{ vars.XCODE_VERSION }}.app"
          fi
          xcodebuild -version

      - name: Generate Xcode project
        run: bash scripts/ci/generate-project.sh

      - name: Install certificate and provisioning profile
        run: |
          # Every sub-step reports a readable ::error:: so problems are visible
          # in the run summary without opening the raw log.
          fail() { echo "::error title=Signing setup::$1"; exit 1; }
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$CERT_PATH" 2>/dev/null \
            || fail "IOS_DIST_CERT_P12_BASE64 is not valid base64 - copy it again with the PowerShell command"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d ' \r\n' | base64 --decode > "$PROFILE_PATH" 2>/dev/null \
            || fail "IOS_PROVISIONING_PROFILE_BASE64 is not valid base64 - copy it again with the PowerShell command"
          echo "p12: $(wc -c < "$CERT_PATH") bytes, profile: $(wc -c < "$PROFILE_PATH") bytes"
          [ "$(wc -c < "$CERT_PATH")" -gt 1000 ] || fail "Decoded .p12 is only $(wc -c < "$CERT_PATH") bytes - IOS_DIST_CERT_P12_BASE64 looks truncated or wrong"
          [ "$(wc -c < "$PROFILE_PATH")" -gt 1000 ] || fail "Decoded profile is only $(wc -c < "$PROFILE_PATH") bytes - IOS_PROVISIONING_PROFILE_BASE64 looks truncated or wrong"

          OUT=$(openssl pkcs12 -in "$CERT_PATH" -nokeys -passin "pass:$IOS_DIST_CERT_PASSWORD" 2>/dev/null | grep -i "subject" | head -1 || true)
          if [ -z "$OUT" ]; then
            OUT=$(openssl pkcs12 -legacy -in "$CERT_PATH" -nokeys -passin "pass:$IOS_DIST_CERT_PASSWORD" 2>/dev/null | grep -i "subject" | head -1 || true)
          fi
          [ -n "$OUT" ] || fail "Cannot open the .p12 with IOS_DIST_CERT_PASSWORD - wrong password, or the p12 secret is not the file you created"
          echo "Certificate: $OUT"
          echo "$OUT" | grep -q "Apple Distribution" || echo "::warning title=Signing setup::Certificate subject does not mention 'Apple Distribution': $OUT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || fail "Could not create temporary keychain"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IMPORT=$(security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" 2>&1) \
            || fail "Keychain import of the .p12 failed: $IMPORT"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          IDS=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")
          echo "$IDS"
          echo "$IDS" | grep -q "Apple Distribution" || fail "No 'Apple Distribution' signing identity after import. Found: $(echo $IDS)"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist" 2>/dev/null \
            || fail "IOS_PROVISIONING_PROFILE_BASE64 is not a valid .mobileprovision file"
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          PP_APPID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          PP_TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE_PATH" "$DIR/$PP_UUID.mobileprovision"
          done

          [ "$PP_TEAM" = "$APPLE_TEAM_ID" ] || fail "APPLE_TEAM_ID is '$APPLE_TEAM_ID' but the profile belongs to team '$PP_TEAM'"
          BUNDLE_ID=$(grep -E '^FQ_BUNDLE_ID' Config/App.xcconfig | cut -d= -f2 | xargs)
          [ "$PP_APPID" = "$APPLE_TEAM_ID.$BUNDLE_ID" ] \
            || fail "Profile is for '$PP_APPID' but the app is '$APPLE_TEAM_ID.$BUNDLE_ID' - check the App ID / FQ_BUNDLE_ID"
          echo "Profile: $PP_NAME ($PP_UUID) for $PP_APPID"
          {
            echo "PP_NAME=$PP_NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Write signing settings and build number
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + ${{ vars.BUILD_NUMBER_OFFSET || 0 }} ))
          VERSION="$RELEASE_VERSION"
          {
            echo "FQ_DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "FQ_CODE_SIGN_STYLE = Manual"
            echo "FQ_CODE_SIGN_IDENTITY = Apple Distribution"
            echo "FQ_PROVISIONING_PROFILE = $PP_NAME"
            echo "CURRENT_PROJECT_VERSION = $BUILD_NUMBER"
            if [ -n "$VERSION" ]; then echo "MARKETING_VERSION = $VERSION"; fi
          } > Config/Signing.generated.xcconfig
          cat Config/Signing.generated.xcconfig
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Familoq.xcodeproj \
            -scheme Familoq \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Familoq.xcarchive" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/archive.log"

      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PP_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Familoq.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Keep IPA as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: Familoq-ipa-build-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: env.SUBMIT_FOR_REVIEW != 'true'
        run: bash scripts/ci/upload-testflight.sh "$RUNNER_TEMP/export/Familoq.ipa"

      - name: Upload, wait for processing and submit for App Store review
        if: env.SUBMIT_FOR_REVIEW == 'true'
        env:
          APP_STORE_AUTO_RELEASE: ${{ vars.APP_STORE_AUTO_RELEASE }}
        run: |
          command -v fastlane >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install fastlane
          fastlane --version
          VERSION=$(/usr/libexec/PlistBuddy -c "Print ApplicationProperties:CFBundleShortVersionString" "$RUNNER_TEMP/Familoq.xcarchive/Info.plist")
          fastlane ios submit_to_app_store \
            ipa:"$RUNNER_TEMP/export/Familoq.ipa" \
            app_identifier:"$BUNDLE_ID" \
            version:"$VERSION" \
            build:"$BUILD_NUMBER"

      - name: Summary
        if: success()
        run: |
          if [ "$SUBMIT_FOR_REVIEW" = "true" ]; then
            echo "## Build $BUILD_NUMBER submitted for App Store review" >> "$GITHUB_STEP_SUMMARY"
            echo "Apple usually reviews within ~24 h. Status: App Store Connect -> Familoq -> Distribution." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Uploaded build $BUILD_NUMBER to TestFlight" >> "$GITHUB_STEP_SUMMARY"
            echo "Processing takes ~5-30 min. Then open TestFlight on your iPhone." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -rf "$HOME/.appstoreconnect" "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          rm -f Config/Signing.generated.xcconfig
